# my-infra-repo/kfp-deployment/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# --- Reference the two upstream Kustomize directories ---
# Use 'resources' for remote targets. Kustomize will fetch and build them.
resources:
  - github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=2.4.1
  - github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=2.4.1

# --- IMPORTANT: Define the target namespace ---
# This ensures namespaced resources from the upstream manifests
# are targeted correctly.
namespace: kubeflow # Should match your desired KFP namespace

# --- FIX: Add the missing Service Account ---
# Create the cache-deployer-sa.yaml file (see below) and reference it
patches:
  - path: cache-deployer-sa.yaml
    target:
      kind: Deployment # Target any existing kind, the SA will just be added
      name: cache-deployer-deployment # It doesn't modify the target, just adds the SA alongside
# --- Patch 2: Explicitly add fsGroup to MinIO pod security context ---
  - patch: |-
      # Indentation is critical here
      - op: add # Use 'add' or 'replace' - 'add' is safer if it might not exist
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000
      # Also add fsGroupChangePolicy for robustness (requires K8s 1.20+)
      - op: add
        path: /spec/template/spec/securityContext/fsGroupChangePolicy
        value: OnRootMismatch
    target:
      kind: Deployment
      name: minio
      namespace: kubeflow # Ensure namespace match for target
# Optional: Add common labels/annotations to all resources if needed
# commonLabels:
#   app.kubernetes.io/part-of: kubeflow-pipelines
#   app.kubernetes.io/managed-by: argocd
