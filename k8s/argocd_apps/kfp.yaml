apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow # Or your preferred name
  namespace: argocd       # Argo CD's namespace
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jainds/madrigal.git 
    path: k8s/my-kubeflow 
    targetRevision: c8f5492473d1211d19a5db9ec4b2af4c7e707db3 

    kustomize: {}

  destination:
    server: https://kubernetes.default.svc 
    
    namespace: kubeflow

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # --- Essential for initial sync and fixing inconsistencies ---
      # - Replace=true
      - ApplyOutOfSyncOnly=true

    automated:
      prune: true
      selfHeal: true
