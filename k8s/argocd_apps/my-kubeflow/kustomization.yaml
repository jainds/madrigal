# digital-ocean/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# --- Reference the two upstream Kustomize directories ---
# Use 'resources' for remote targets. Kustomize will fetch and build them.
resources:
  - github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=2.4.1
  - github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=2.4.1

# --- IMPORTANT: Define the target namespace ---
# This ensures namespaced resources from the upstream manifests
# are targeted correctly.
namespace: kubeflow 

# --- FIX: Add the missing Service Account ---
# Create the cache-deployer-sa.yaml file (see below) and reference it
patches:
  - path: cache-deployer-sa.yaml
    target:
      kind: Deployment 
      name: cache-deployer-deployment 
# Fix the   pod level securityContext in minio    
patchesStrategicMerge:
  - |-
    # This patch merges the securityContext into the pod spec template
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: minio       # Match the resource name
      namespace: kubeflow # Match the resource namespace
    spec:
      template:        
        spec:
          securityContext: # Define the pod-level security context
            fsGroup: 1000 # Set the desired fsGroup
            fsGroupChangePolicy: OnRootMismatch # Add the policy

